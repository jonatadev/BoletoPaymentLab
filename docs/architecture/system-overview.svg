<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 640" role="img" aria-labelledby="title desc">
<title id="title">Boleto Payment Lab architecture</title>
<desc id="desc">REST and MCP clients authenticate with JWTs. Spring Boot stores boletos and Outbox events in PostgreSQL and relays events to Kafka. The optional MCP service queries analytics views through a read-only role. Both services verify tokens using Keycloak keys.</desc>
