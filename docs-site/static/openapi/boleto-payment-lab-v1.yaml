                title: Service Unavailable
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Database temporarily unavailable
      security:
        - oauth2:
            - boletos:read
        - bearerJwt: []
      summary: Retrieve a boleto by UUID.
      tags:
        - Queries
  /api/v1/boletos/{id}/cancellations:
    post:
      description: Requires the `boletos:cancel` scope with either authentication
