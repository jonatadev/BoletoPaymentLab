          description: Successful response
        '400':
          content:
            application/problem+json:
              example:
                code: INVALID_REQUEST
                detail: The request is invalid.
                status: 400
                title: Bad Request
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid input
        '401':
          content:
            application/problem+json:
              example:
                code: UNAUTHORIZED
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
        '403':
          content:
            application/problem+json:
              example:
                code: FORBIDDEN
                status: 403
                title: Forbidden
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer error="insufficient_scope"
        '404':
          content:
            application/problem+json:
              example:
                code: BOLETO_NOT_FOUND
                status: 404
                title: Not Found
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Record not found
        '503':
          content:
            application/problem+json:
              example:
                code: DATABASE_UNAVAILABLE
