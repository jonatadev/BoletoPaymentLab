                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer error="insufficient_scope"
        '404':
          content:
            application/problem+json:
              example:
                code: BOLETO_NOT_FOUND
                status: 404
                title: Not Found
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Record not found
        '409':
          content:
            application/problem+json:
              example:
                code: INVALID_STATE_TRANSITION
