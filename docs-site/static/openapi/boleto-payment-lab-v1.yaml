              schema:
                $ref: '#/components/schemas/Snapshot'
          description: Successful response
        '400':
          content:
            application/problem+json:
              example:
                code: INVALID_REQUEST
                detail: The request is invalid.
                status: 400
                title: Bad Request
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid input
        '401':
          content:
            application/problem+json:
              example:
                code: UNAUTHORIZED
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
        '403':
          content:
            application/problem+json:
              example:
                code: FORBIDDEN
                status: 403
                title: Forbidden
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer error="insufficient_scope"
        '404':
          content:
            application/problem+json:
              example:
                code: BOLETO_NOT_FOUND
                status: 404
                title: Not Found
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Record not found
        '409':
          content:
            application/problem+json:
              example:
                code: INVALID_STATE_TRANSITION
                detail: The requested transition is not valid for the current state.
                status: 409
                title: Conflict
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Conflict with the current state or idempotency key
        '503':
          content:
            application/problem+json:
              example:
                code: DATABASE_UNAVAILABLE
                detail: Database is temporarily unavailable.
                status: 503
                title: Service Unavailable
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Database temporarily unavailable
      security:
        - oauth2:
            - boletos:cancel
        - bearerJwt: []
      summary: Cancel an issued, unexpired boleto.
      tags:
        - Lifecycle
  /api/v1/boletos/{id}/history:
