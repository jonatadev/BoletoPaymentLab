components:
  schemas:
    AuditEntry:
      type: object
      properties:
        correlationId:
          type: string
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
        newStatus:
          type: string
        previousStatus:
          type: string
        source:
          type: string
        timestamp:
          type: string
          format: date-time
    Comparison:
      type: object
      properties:
        changedFields:
          type: array
          items:
            type: string
        from:
          type: integer
          format: int64
        to:
          type: integer
          format: int64
    Detail:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        state:
          $ref: '#/components/schemas/State'
    JsonNode:
      type: object
    Metadata:
      type: object
      properties:
        actor:
          type: string
        correlationId:
          type: string
        operation:
          type: string
          enum:
            - ADD
            - MOD
            - DEL
        revision:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
    PageResult:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Snapshot'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    Problem:
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
        instance:
          type: string
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          example: about:blank
      required:
        - code
        - status
        - title
        - type
    Snapshot:
      type: object
      properties:
        amount:
          type: number
        currency:
          type: string
        customerId:
          type: string
        dueDate:
          type: string
          format: date
        id:
          type: string
          format: uuid
        issuedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - EMITIDO
            - PAGO
            - VENCIDO
            - CANCELADO
    State:
      type: object
      properties:
        amount:
          type: number
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        dueDate:
          type: string
          format: date
        issuedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - EMITIDO
            - PAGO
            - VENCIDO
            - CANCELADO
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        version:
          type: integer
          format: int64
  securitySchemes:
    bearerJwt:
      bearerFormat: JWT
      description: Paste an externally acquired access token with the operation's
        required scope.
      scheme: bearer
      type: http
    oauth2:
      description: Acquire a service token outside the browser. Configure the token
        URL for your realm.
      flows:
        clientCredentials:
          scopes:
            boletos:audit: Read audit records and revisions
            boletos:cancel: Cancel an issued boleto
            boletos:issue: Issue boletos
            boletos:list: List boletos
            boletos:pay: Simulate payment
            boletos:read: Read boletos and download PDFs
            ops:metrics: Read operational metrics
          tokenUrl: http://127.0.0.1:8180/realms/boleto-lab/protocol/openid-connect/token
      type: oauth2
