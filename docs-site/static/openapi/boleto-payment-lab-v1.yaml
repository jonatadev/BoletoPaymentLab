openapi: 3.0.4
info:
  description: Educational REST API for synthetic boleto records. No real bank payment
    is supported.
  title: Boleto Payment Lab API
  version: v1
servers:
  - description: Current API origin
    url: /
paths:
  /actuator/health:
    get:
      operationId: getHealth
      responses:
        '200':
          content:
            application/json:
              example:
                status: UP
              schema:
                type: object
                properties:
                  status:
                    type: string
          description: Probe is available
        '503':
          content:
            application/json:
              example:
                status: DOWN
              schema:
                type: object
                properties:
                  status:
                    type: string
          description: Probe is unavailable
      security: []
      summary: Read the Actuator probe status
      tags:
        - Operations
  /actuator/health/liveness:
    get:
      operationId: getLiveness
      responses:
        '200':
          content:
            application/json:
              example:
                status: UP
              schema:
                type: object
                properties:
                  status:
                    type: string
          description: Probe is available
        '503':
          content:
            application/json:
              example:
                status: DOWN
              schema:
                type: object
                properties:
                  status:
                    type: string
          description: Probe is unavailable
      security: []
      summary: Read the Actuator probe status
      tags:
        - Operations
  /actuator/health/readiness:
    get:
      operationId: getReadiness
      responses:
        '200':
          content:
            application/json:
              example:
                status: UP
              schema:
                type: object
                properties:
                  status:
                    type: string
          description: Probe is available
        '503':
          content:
            application/json:
              example:
                status: DOWN
              schema:
                type: object
                properties:
                  status:
                    type: string
          description: Probe is unavailable
      security: []
      summary: Read the Actuator probe status
      tags:
        - Operations
  /actuator/metrics:
    get:
      description: Requires the `ops:metrics` scope with either authentication option.
      operationId: listMetrics
      responses:
        '200':
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
                properties:
                  names:
                    type: array
                    items:
                      type: string
          description: Actuator metrics response
        '401':
          content:
            application/problem+json:
              example:
                code: UNAUTHORIZED
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
        '403':
          content:
            application/problem+json:
              example:
                code: FORBIDDEN
                status: 403
                title: Forbidden
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer error="insufficient_scope"
      security:
        - oauth2:
            - ops:metrics
        - bearerJwt: []
      summary: List registered metric names
      tags:
        - Operations
  /actuator/metrics/{name}:
    get:
      description: Requires the `ops:metrics` scope with either authentication option.
      operationId: getMetric
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - description: Repeat tag=key:value to filter measurements.
          in: query
          name: tag
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
                properties:
                  availableTags:
                    type: array
                    items:
                      type: object
                      properties:
                        tag:
                          type: string
                        values:
                          type: array
                          items:
                            type: string
                  baseUnit:
                    type: string
                    nullable: true
                  description:
                    type: string
                    nullable: true
                  measurements:
                    type: array
                    items:
                      type: object
                      properties:
                        statistic:
                          type: string
                        value:
                          type: number
                  name:
                    type: string
          description: Actuator metrics response
        '401':
          content:
            application/problem+json:
              example:
                code: UNAUTHORIZED
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
        '403':
          content:
            application/problem+json:
              example:
                code: FORBIDDEN
                status: 403
                title: Forbidden
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer error="insufficient_scope"
        '404':
          description: Unknown metric
      security:
        - oauth2:
            - ops:metrics
        - bearerJwt: []
      summary: Read measurements for a registered metric
      tags:
        - Operations
  /api/v1/boletos:
    get:
      description: Requires the `boletos:list` scope with either authentication option.
      operationId: listBoletos
      parameters:
        - in: query
          name: customerId
          required: false
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum:
              - EMITIDO
              - PAGO
              - VENCIDO
              - CANCELADO
        - description: Inclusive issuance date in America/Sao_Paulo.
          in: query
          name: from
          required: false
          schema:
            type: string
            format: date
        - description: Inclusive issuance date in America/Sao_Paulo.
          in: query
          name: to
          required: false
          schema:
            type: string
            format: date
        - description: Zero-based page. The page multiplied by size must not exceed
            100000.
          in: query
          name: page
          required: false
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - in: query
          name: size
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            maximum: 100
            minimum: 1
        - description: Field and direction. UUID breaks ties for non-ID fields.
          in: query
          name: sort
          required: false
          schema:
            type: string
            default: issuedAt,desc
            pattern: ^(issuedAt|dueDate|amount|id),(asc|desc)$
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResult'
          description: Successful response
        '400':
          content:
            application/problem+json:
              example:
                code: INVALID_REQUEST
                detail: The request is invalid.
                status: 400
                title: Bad Request
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid input
        '401':
          content:
            application/problem+json:
              example:
                code: UNAUTHORIZED
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
        '403':
          content:
            application/problem+json:
              example:
                code: FORBIDDEN
                status: 403
                title: Forbidden
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer error="insufficient_scope"
        '503':
          content:
            application/problem+json:
              example:
                code: DATABASE_UNAVAILABLE
                detail: Database is temporarily unavailable.
                status: 503
                title: Service Unavailable
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Database temporarily unavailable
      security:
        - oauth2:
            - boletos:list
        - bearerJwt: []
      summary: List boletos by customer, effective status and inclusive issuance-date
        range.
      tags:
        - Queries
    post:
      description: Requires the `boletos:issue` scope with either authentication option.
      operationId: issueBoleto
      parameters:
        - description: Single printable ASCII key without spaces or commas, scoped
            to the customer and issuance operation.
          in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            maxLength: 160
            minLength: 1
            pattern: ^(?!.*,)[!-~]{1,160}$
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                amount:
                  type: number
                  example: 10.0
                  maximum: 999999.99
                  minimum: 0.01
                  multipleOf: 0.01
                customerId:
                  type: string
                  example: customer-demo-001
                  maxLength: 120
                  minLength: 1
                  pattern: ^[A-Za-z0-9._-]{1,120}$
                dueDate:
                  type: string
                  format: date
                  description: Future date in America/Sao_Paulo on first issuance.
                  example: 2099-11-30T00:00:00Z
              required:
                - amount
                - customerId
                - dueDate
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                amount: 10.0
                currency: BRL
                customerId: customer-demo-001
                dueDate: 2099-11-30T00:00:00Z
                id: 6a96c74d-1094-4ddd-b96a-a27145096e54
                issuedAt: 2026-11-23T12:00:00Z
                status: EMITIDO
              schema:
                $ref: '#/components/schemas/Snapshot'
          description: Matching request replayed with the original boleto UUID
        '201':
          content:
            application/json:
              example:
                amount: 10.0
                currency: BRL
                customerId: customer-demo-001
                dueDate: 2099-11-30T00:00:00Z
                id: 6a96c74d-1094-4ddd-b96a-a27145096e54
                issuedAt: 2026-11-23T12:00:00Z
                status: EMITIDO
              schema:
                $ref: '#/components/schemas/Snapshot'
          description: New boleto issued
          headers:
            Location:
              description: Relative URI of the issued boleto
              schema:
                type: string
        '400':
          content:
            application/problem+json:
              example:
                code: INVALID_REQUEST
                detail: The request is invalid.
                status: 400
                title: Bad Request
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid input
        '401':
          content:
            application/problem+json:
              example:
                code: UNAUTHORIZED
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
        '403':
          content:
            application/problem+json:
              example:
                code: FORBIDDEN
                status: 403
                title: Forbidden
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer error="insufficient_scope"
        '409':
          content:
            application/problem+json:
              examples:
                differentPayload:
                  value:
                    code: IDEMPOTENCY_CONFLICT
                    detail: The key is associated with a different request.
                    status: 409
                    title: Conflict
                    type: about:blank
                inProgress:
                  value:
                    code: OPERATION_IN_PROGRESS
                    detail: Issuance is in progress. Retry after the indicated delay.
                    status: 409
                    title: Conflict
                    type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Key conflict or issuance still in progress
          headers:
            Retry-After:
              description: Present for OPERATION_IN_PROGRESS
              schema:
                type: string
                example: '1'
        '503':
          content:
            application/problem+json:
              example:
                code: DATABASE_UNAVAILABLE
                detail: Database is temporarily unavailable.
                status: 503
                title: Service Unavailable
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Database temporarily unavailable
      security:
        - oauth2:
            - boletos:issue
        - bearerJwt: []
      summary: Issue a synthetic boleto or replay a completed request.
      tags:
        - Issuance
  /api/v1/boletos/{id}:
    get:
