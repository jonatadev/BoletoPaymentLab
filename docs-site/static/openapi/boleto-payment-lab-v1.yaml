  /api/v1/boletos/{id}/pdf:
    get:
      description: Requires the `boletos:read` scope with either authentication option.
      operationId: downloadBoletoPdf
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: Successful response
          headers:
            Content-Disposition:
              description: 'Attachment filename: boleto-{id}.pdf'
              schema:
                type: string
        '400':
          content:
            application/problem+json:
              example:
                code: INVALID_REQUEST
                detail: The request is invalid.
                status: 400
                title: Bad Request
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid input
        '401':
          content:
            application/problem+json:
              example:
                code: UNAUTHORIZED
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
        '403':
          content:
            application/problem+json:
              example:
                code: FORBIDDEN
                status: 403
                title: Forbidden
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer error="insufficient_scope"
        '404':
          content:
            application/problem+json:
              example:
                code: BOLETO_NOT_FOUND
                status: 404
                title: Not Found
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Record not found
        '500':
          content:
            application/problem+json:
              example:
                code: PDF_RENDER_FAILED
                detail: Could not render the document.
                status: 500
                title: Internal Server Error
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: PDF rendering failed
        '503':
          content:
            application/problem+json:
              example:
                code: DATABASE_UNAVAILABLE
                detail: Database is temporarily unavailable.
                status: 503
                title: Service Unavailable
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Database temporarily unavailable
      security:
        - oauth2:
            - boletos:read
        - bearerJwt: []
      summary: Download a synthetic PDF. It is not valid for bank payment.
      tags:
        - Documents
  /api/v1/boletos/{id}/revisions:
    get:
