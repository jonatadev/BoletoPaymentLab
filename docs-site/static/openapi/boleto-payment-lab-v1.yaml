                status: 400
                title: Bad Request
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid input
        '401':
          content:
            application/problem+json:
              example:
                code: UNAUTHORIZED
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
          headers:
            WWW-Authenticate:
              schema:
