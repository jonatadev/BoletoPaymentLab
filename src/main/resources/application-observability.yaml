management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    prometheus:
      access: read-only
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        bpl.issuance: true
        bpl.pdf.render: true
