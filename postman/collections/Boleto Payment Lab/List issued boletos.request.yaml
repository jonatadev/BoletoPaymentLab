$kind: http-request
url: "{{baseUrl}}/api/v1/boletos?customerId={{customerId}}&status=EMITIDO&page=0&size=5&sort=issuedAt,desc"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{readerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Paged content', () => pm.expect(pm.response.json().content).to.be.an('array'));
    language: text/javascript
order: 14000
