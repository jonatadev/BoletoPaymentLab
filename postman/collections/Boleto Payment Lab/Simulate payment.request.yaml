$kind: http-request
url: "{{baseUrl}}/api/v1/boletos/{{boletoId}}/payments"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{operatorToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Is paid', () => pm.expect(pm.response.json().status).to.eql('PAGO'));
    language: text/javascript
order: 15000
