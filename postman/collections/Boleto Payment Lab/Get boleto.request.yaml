$kind: http-request
url: "{{baseUrl}}/api/v1/boletos/{{boletoId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{readerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Same boleto UUID', () => pm.expect(pm.response.json().id).to.eql(pm.environment.get('boletoId')));
    language: text/javascript
order: 6000
