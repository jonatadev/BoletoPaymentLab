$kind: http-request
url: "{{baseUrl}}/api/v1/boletos/{{nonexistentBoletoId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{readerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 404', () => pm.response.to.have.status(404));
      pm.test('ProblemDetail code', () => pm.expect(pm.response.json().code).to.eql('BOLETO_NOT_FOUND'));
      pm.test('ProblemDetail content type', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json'));
    language: text/javascript
order: 12000
