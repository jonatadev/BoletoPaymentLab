$kind: http-request
url: "{{baseUrl}}/api/v1/boletos/{{boletoId}}/cancellations"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{operatorToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Is canceled', () => pm.expect(pm.response.json().status).to.eql('CANCELADO'));
    language: text/javascript
order: 16000
