$kind: http-request
url: "{{baseUrl}}/api/v1/boletos"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{idempotencyKey}}"
body:
  type: json
  content: '{"customerId":"{{customerId}}","amount":10,"dueDate":"{{dueDate}}"}'
auth:
  type: bearer
  credentials:
    token: "{{issuerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Same boleto UUID', () => pm.expect(pm.response.json().id).to.eql(pm.environment.get('boletoId')));
    language: text/javascript
order: 8000
