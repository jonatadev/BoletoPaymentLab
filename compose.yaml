services:
  boleto-payment-lab:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    image: boleto-payment-lab:local
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: platform
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      BPL_OIDC_ISSUER: http://keycloak:8080/realms/boleto-lab
      BPL_KAFKA_BOOTSTRAP: kafka:29092
      BPL_KAFKA_CA: /run/kafka/ca.pem
      SPRING_CONFIG_IMPORT: file:/run/kafka/spring.yaml
      BPL_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-provision:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    networks: [default, kafka]
    volumes:
      - ./.kafka-secrets/${KAFKA_SECRET_INSTANCE:-local}/app:/run/kafka:ro

  boleto-analytics-mcp:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: boleto-analytics-mcp/Dockerfile
    image: boleto-analytics-mcp:local
    environment:
      MCP_SERVER_ADDRESS: 0.0.0.0
      MCP_SERVER_PORT: 8090
      MCP_DATABASE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      MCP_DATABASE_USERNAME: ${MCP_DATABASE_USERNAME:?Set MCP_DATABASE_USERNAME in .env}
      MCP_DATABASE_PASSWORD: ${MCP_DATABASE_PASSWORD:?Set MCP_DATABASE_PASSWORD in .env}
      MCP_AUTH_ISSUER: http://keycloak:8080/realms/boleto-lab
      MCP_AUTH_AUDIENCE: boleto-analytics-mcp
    ports:
      - "127.0.0.1:${MCP_SERVER_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8090/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.23.0
    ports:
      - "127.0.0.1:${JAEGER_PORT:-16686}:16686"
      - "127.0.0.1:${OTLP_PORT:-4318}:4318"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Set KC_BOOTSTRAP_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set KC_BOOTSTRAP_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: http://127.0.0.1:${KEYCLOAK_PORT:-8180}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./infra/keycloak:/opt/keycloak/data/import:ro

  kafka:
    image: apache/kafka:4.2.2
    entrypoint: ["/bin/bash", "/opt/bpl-kafka/start.sh"]
    environment:
      KAFKA_PORT: ${KAFKA_PORT:-9092}
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./infra/kafka:/opt/bpl-kafka:ro
      - ./.kafka-secrets/${KAFKA_SECRET_INSTANCE:-local}/broker:/run/kafka:ro
    networks: [kafka]
    healthcheck:
      test: ["CMD", "/bin/bash", "/opt/bpl-kafka/health.sh"]
      interval: 15s
      timeout: 15s
      retries: 12
      start_period: 30s

  kafka-provision:
    build: ./infra/kafka
    image: boleto-kafka-admin:local
    command: ["KafkaSecurity"]
    environment:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2 -Xmx192m
    volumes:
      - ./.kafka-secrets/${KAFKA_SECRET_INSTANCE:-local}/admin:/run/kafka:ro
    networks: [kafka]
    depends_on:
      kafka:
        condition: service_healthy

  kafka-ui:
    profiles: ["kafka-ui"]
    image: ghcr.io/kafbat/kafka-ui:v1.5.1
    restart: unless-stopped
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/run/kafka/application.yaml
      DYNAMIC_CONFIG_ENABLED: "false"
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8085}:8080"
    depends_on:
      kafka-provision:
        condition: service_completed_successfully
    volumes:
      - ./.kafka-secrets/${KAFKA_SECRET_INSTANCE:-local}/ui:/run/kafka:ro
    networks: [kafka]

networks:
  kafka:

volumes:
  postgres-data:
  keycloak-data:
  kafka-data:
