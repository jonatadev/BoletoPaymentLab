server {
    listen 8080;
    access_log off;

    proxy_set_header Host $host;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $remote_addr;

    # Deny encoded separators and dot segments before upstream path handling.
    if ($request_uri ~* "^[^?]*(%2e|%2f|%5c|/\\.\\.?(/|[?]|$))") { return 404; }

    location = /.well-known/oauth-authorization-server/realms/boleto-lab {
        proxy_pass http://keycloak-chatgpt:8080;
    }

    location ~ ^/realms/boleto-lab/(\.well-known/(openid-configuration|oauth-authorization-server)|protocol/openid-connect/(auth|token|certs)|login-actions/(authenticate|required-action|restart))$ {
        proxy_pass http://keycloak-chatgpt:8080;
    }
    location ~ ^/resources/[A-Za-z0-9_./-]+$ {
        proxy_pass http://keycloak-chatgpt:8080;
    }
    location / { return 404; }
}
