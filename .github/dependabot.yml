version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: [dependencies, gradle]
    commit-message:
      prefix: build
      include: scope
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /boleto-analytics-mcp
    schedule:
      interval: weekly
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: [dependencies, gradle]
    commit-message:
      prefix: build
      include: scope
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: build
      include: scope
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /boleto-analytics-mcp
    schedule:
      interval: weekly
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: build
      include: scope
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
