name: Gitleaks

"on":
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Scan pull request commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull request head
        # actions/checkout pinned by commit SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the pull request commit range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
          GITLEAKS_DIGEST: >-
            c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          range="${BASE_SHA}..${HEAD_SHA}"
          image="${GITLEAKS_IMAGE}@sha256:${GITLEAKS_DIGEST}"
          docker run --rm --network none \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/repo,readonly" \
            "$image" git --redact=100 --no-banner \
            --log-opts="--full-history --diff-merges=first-parent $range" /repo
